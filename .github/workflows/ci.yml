name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version — no version is hardcoded in this YAML. Use
        # the upstream installer so the versioned ~/.cyrius/versions/<ver>/
        # layout matches how cyrius resolves the pin.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # `cyrius deps` copies the [deps].stdlib modules from the installed
        # toolchain into lib/. rupa is a pure-Cyrius leaf — no external libs.
        # Never symlink lib/ to a cyrius checkout (cross-repo writes).
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Lint
        # Hard gate: a warning, an untracked deferral, or a cyrlint failure fails CI.
        # ⚠ Three signals, because none covers the others (measured on 6.6.6): plain
        # `cyrius lint` exits 0 even with warnings and untracked deferrals, and prints
        # the latter as `deferral line N:`, which a `warn` grep never sees;
        # `--strict-deferrals` exits 2 on an untracked deferral but still 0 on warnings;
        # and a file cyrlint cannot read prints no `warn` line — only its exit code says
        # so. A deferral cross-referenced to a CHANGELOG/issue/roadmap entry prints
        # nothing and passes.
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr; do
            [ -e "$f" ] || continue
            rc=0
            out=$(cyrius lint "$f" --strict-deferrals 2>&1) || rc=$?
            echo "$out"
            if echo "$out" | grep -qE '^[[:space:]]*warn '; then
              echo "lint: warnings in $f"; fail=1
            fi
            if echo "$out" | grep -qE '^[[:space:]]*deferral '; then
              echo "lint: untracked deferral in $f"; fail=1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "lint: cyrlint exited $rc on $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: gate failed"; exit 1; }

      - name: Format check
        # cyrius fmt reports via EXIT CODE with --check (0 = clean). Flag position
        # stopped mattering at cyrius 6.6.5 (one argument parser for every command).
        # ⚠ --check accepts a 2- or 4-space continuation indent per open paren, where
        # `cyrius fmt` writes 2 — the leniency rupa asked for at 0.1.3 (cyrius v6.5.28,
        # issues/archived/2026-08-17-fmt-check-rejects-wrapped-calls.md). So a file can
        # pass here and still move under `cyrius fmt` (all six were canonical at 0.1.8).
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr; do
            [ -e "$f" ] || continue
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet programs/smoke.cyr

      - name: Verify dist/ is current (bundle + dep sidecar)
        # `cyrius distlib --check` regenerates into a temp file and byte-compares BOTH
        # dist/rupa.cyr and dist/rupa.deps with what is committed, writing nothing, and
        # fails when either is missing. The step it replaced ran `distlib` and then
        # `git diff --quiet dist/rupa.cyr`: it never looked at the sidecar consumers
        # resolve their stdlib from, and a deleted or untracked file has no diff.
        # ⛔ --check SKIPS distlib's bundle self-compile, so plain `cyrius distlib` runs
        # after it (setu's shape, 0.8.11). Keep this order: plain distlib rewrites dist/,
        # and --check would then find nothing stale.
        run: |
          if ! cyrius distlib --check; then
            cyrius distlib > /dev/null 2>&1 || true
            echo "ERROR: dist/ is stale. Run 'cyrius distlib' and commit dist/ exactly as it writes it."
            git status --short dist/
            git --no-pager diff dist/ | head -60
            exit 1
          fi
          cyrius distlib
          echo "dist/ matches src/"

      - name: Build (link-check, DCE on)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build programs/smoke.cyr build/rupa-smoke
          echo "smoke: $(wc -c < build/rupa-smoke) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/rupa-smoke | grep -q "7f45 4c46"

      - name: Run smoke
        # The smoke returns 1 on any theme-token or motion mismatch. Building it proves
        # the chain links; only running it proves the chain answers. Until 0.1.8 CI built
        # it and never ran it (it is not a programs/*_test.cyr), so no check in it ran.
        run: ./build/rupa-smoke

      - name: Test (RUN suites)
        # Every programs/*_test.cyr is a self-checking RUN test: it draws/acts,
        # asserts pixel/state, and exits non-zero on failure. Globbed so new
        # suites are auto-picked. Native cyrius test suites (tests/tcyr/*.tcyr)
        # run too when they land. NOTE: no test blits to /dev/fb0.
        run: |
          mkdir -p build
          for t in programs/*_test.cyr; do
            [ -e "$t" ] || continue
            name=$(basename "$t" .cyr)
            echo "== $t =="
            cyrius build "$t" "build/$name"
            "./build/$name" || { echo "FAIL: $t"; exit 1; }
          done
          for f in tests/tcyr/*.tcyr; do [ -e "$f" ] || continue; cyrius test "$f" || exit 1; done

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ programs/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          scan "raw execve"  'syscall( *59'
          scan "raw fork"    'syscall( *57'
          scan "sys_system"  '\bsys_system\s*('
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING (required): $f"; MISSING=1; fi
          done
          for f in CONTRIBUTING.md SECURITY.md LICENSE; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  WARN (optional, not yet present): $f"; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION file: $VERSION"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
